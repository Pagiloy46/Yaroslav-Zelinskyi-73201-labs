
project:
  name: "Lab 7 - Compression"
  seed: 42
  device: "auto"

data:
  name: "FashionMNIST"
  root: "data"
  batch_size: 128
  num_workers: 0

training:
  epochs: 10
  learning_rate: 0.001
  optimizer: "Adam"

model:
  num_classes: 10

pruning:
  global_sparsity: [0.0, 0.25, 0.5, 0.75, 0.9, 0.95]
  structured_sparsity: [0.1, 0.25, 0.5]
  finetune_epochs: 3

distillation:
  temperature: 4
  alpha: 0.5
  student_epochs: 10
